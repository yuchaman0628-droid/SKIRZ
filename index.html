<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>極上ぷにぷに！ASMR 3Dスクイーズガチャ</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ffe6fa 0%, #e0c3fc 50%, #8ec5fc 100%);
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* ヘッダー UI */
        .header-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .coin-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.2);
            backdrop-filter: blur(10px);
            font-size: 24px;
            font-weight: 900;
            color: #ff5e97;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #fff;
        }

        .sub-text {
            margin-top: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #6a5aca;
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 16px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 浮き出るコイン演出 */
        .pop-text {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            color: #ffb703;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2), 0 0 8px #fff;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            50% { transform: translate(-50%, -30px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
        }

        /* ボタンUI */
        .bottom-ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn-action {
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
            border: 3px solid #ffb6c1;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            color: #ff477e;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 25px rgba(255, 182, 193, 0.6);
        }

        .btn-action:active { transform: translateY(1px); }

        /* モーダル */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(50, 20, 60, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            overflow-y: auto;
            position: relative;
            border: 4px solid #fff;
        }

        .modal-title {
            margin-top: 0;
            font-size: 22px;
            color: #ff477e;
            text-align: center;
            font-weight: 900;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            border: none; background: none;
            font-size: 28px; cursor: pointer; color: #aaa;
            font-weight: bold;
        }

        /* ガチャカード */
        .gacha-card {
            background: #fff5f8;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #ffe1ec;
        }

        .gacha-info h4 { margin: 0 0 4px 0; color: #4a4a4a; font-size: 16px; }
        .gacha-info p { margin: 0; font-size: 12px; color: #888; }

        .btn-draw {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            border: none;
            color: white;
            font-weight: 900;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn-draw:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* コレクション */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .item-card {
            background: #fdfbfb;
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            border: 3px solid #eee;
            transition: all 0.2s;
        }

        .item-card.unlocked { background: #fff0f5; border-color: #ffd1dc; }
        .item-card.equipped { border-color: #ff477e; background: #ffe6ee; transform: scale(1.03); }
        .item-card.locked { opacity: 0.35; cursor: not-allowed; }
        .item-icon { font-size: 34px; margin-bottom: 4px; }
        .item-name { font-size: 11px; font-weight: bold; color: #555; }
        .item-sound { font-size: 9px; color: #ff6b81; font-weight: bold; margin-top: 2px; }

        /* ガチャ結果ポップアップ */
        .result-popup { text-align: center; padding: 20px; }
        .result-icon { font-size: 80px; animation: bounce 0.6s ease infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    </style>
    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="header-ui">
        <div class="coin-box">
            <span>🪙</span> <span id="coin-count">0</span> G
        </div>
        <div class="sub-text">スクイーズをつねると極上音＆お金GET！</div>
    </div>

    <div class="bottom-ui">
        <button class="btn-action" id="open-gacha">🎰 ガチャ</button>
        <button class="btn-action" id="open-collection">🧸 もちもの</button>
    </div>

    <!-- ガチャモーダル -->
    <div class="modal-overlay" id="modal-gacha">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('modal-gacha')">×</button>
            <h3 class="modal-title">✨ スクイーズガチャ ✨</h3>
            <div id="gacha-list"></div>
        </div>
    </div>

    <!-- コレクションモーダル -->
    <div class="modal-overlay" id="modal-collection">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('modal-collection')">×</button>
            <h3 class="modal-title">🧸 あなたのコレクション</h3>
            <div class="collection-grid" id="collection-list"></div>
        </div>
    </div>

    <!-- ガチャ結果モーダル -->
    <div class="modal-overlay" id="modal-result">
        <div class="modal result-popup">
            <div class="result-icon" id="result-icon">🎁</div>
            <h2 id="result-title" style="color: #ff477e; margin: 5px 0;">GET!</h2>
            <p id="result-name" style="font-weight: bold; color: #555; font-size: 18px; margin: 5px 0;"></p>
            <p id="result-sound-tag" style="font-size: 13px; color: #ff6b81; font-weight: bold;"></p>
            <button class="btn-action" style="margin: 15px auto 0;" onclick="closeModal('modal-result')">触ってみる！</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. 形ごとのスクイーズデータ（質感・形・サウンド） ---
        const SQUISHIES = [
            { 
                id: 'crispy_bag', name: 'パリパリ袋スクイーズ', icon: '🛍️', gachaId: 'normal', type: 'peach', 
                soundName: '🛍️ パリパリフィルム音', soundType: 'crinkle_bag', color: 0xffb7b2 
            },
            { 
                id: 'peach', name: '桃色ぷにたま', icon: '🍑', gachaId: 'normal', type: 'peach', 
                soundName: '💧 もっちり水感音', soundType: 'moist_squish', color: 0xffa0b4 
            },
            { 
                id: 'donut', name: 'いちごドーナツ', icon: '🍩', gachaId: 'normal', type: 'donut', 
                soundName: '🍞 ふんわり生地音', soundType: 'fluffy_dough', color: 0xff70a6 
            },
            { 
                id: 'macaron', name: 'ピスタチオマカロン', icon: '🟢', gachaId: 'sweets', type: 'macaron', 
                soundName: '☁️ サクもちクリーム音', soundType: 'soft_cream', color: 0xb5e7a0 
            },
            { 
                id: 'star', name: 'こんぺいとう', icon: '⭐', gachaId: 'sweets', type: 'star', 
                soundName: '✨ シャリぷに音', soundType: 'jelly_chime', color: 0xfff475 
            },
            { 
                id: 'gold_egg', name: '黄金のプチたま', icon: '👑', gachaId: 'premium', type: 'peach', 
                soundName: '🔔 ごーじゃす音', soundType: 'gold_sparkle', color: 0xffd700, metal: 0.8, rough: 0.15 
            },
            { 
                id: 'crystal', name: '宇宙のゼリー', icon: '💎', gachaId: 'premium', type: 'crystal', 
                soundName: '🔮 ぷるるん神秘音', soundType: 'crystal_pop', color: 0xa594f9, trans: 0.5 
            }
        ];

        const GACHAS = [
            { id: 'normal', name: 'ノーマルガチャ', cost: 50, desc: 'パリパリ袋＆水感テイストのスクイーズ' },
            { id: 'sweets', name: 'スイーツガチャ', cost: 150, desc: 'マカロンや星の贅沢な感触' },
            { id: 'premium', name: 'プレミアムガチャ', cost: 400, desc: '黄金＆輝くクリスタル限定！' }
        ];

        let state = {
            coins: 0,
            unlocked: ['crispy_bag'],
            equipped: 'crispy_bag'
        };

        // --- 2. リアルタイム音響合成（Web Audio API） ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 形ごとにまったく違う「極上気持ちいい音」を数学的に生成
        function playSquishSound(soundType, intensity = 1.0) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (soundType === 'crinkle_bag') {
                // 🛍️ ビニール袋・フィルムをくしゃくしゃ揉む「ガサガサ・パリパリ」音
                const numCrinkles = 6 + Math.floor(Math.random() * 5);
                for (let i = 0; i < numCrinkles; i++) {
                    const delay = now + Math.random() * 0.14;
                    const bufSize = audioCtx.sampleRate * (0.008 + Math.random() * 0.015);
                    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let j = 0; j < bufSize; j++) {
                        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufSize * 0.3));
                    }

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.setValueAtTime(1800 + Math.random() * 3500, delay);

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime((0.35 + Math.random() * 0.35) * intensity, delay);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    noise.start(delay);
                }
            } else if (soundType === 'moist_squish') {
                // 🍑 水分たっぷりの「ジュワッ・ぐにゃっ」音
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260 * (0.8 + Math.random()*0.4), now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.18);

                gain.gain.setValueAtTime(0.4 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                const bufSize = audioCtx.sampleRate * 0.06;
                const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.linearRampToValueAtTime(150, now + 0.06);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.25 * intensity, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                osc.connect(gain); gain.connect(audioCtx.destination);
                noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.19);
                noise.start(now);

            } else if (soundType === 'fluffy_dough') {
                // 🍩 空気をたっぷり含んだ「シュフッ・フフッ」という生地音
                const bufSize = audioCtx.sampleRate * 0.14;
                const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.Q.value = 2.5;
                filter.frequency.setValueAtTime(1100, now);
                filter.frequency.exponentialRampToValueAtTime(220, now + 0.14);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.45 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now);

            } else if (soundType === 'soft_cream') {
                // 🟢 クリームを押しつぶす「モチュッ」音
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.15);

                gain.gain.setValueAtTime(0.35 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.16);

            } else if (soundType === 'jelly_chime') {
                // ⭐ こんぺいとう・ゼリーの「プチポンッ」高音
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(650 + Math.random()*200, now);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.12);

                gain.gain.setValueAtTime(0.3 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.13);

            } else if (soundType === 'crystal_pop') {
                // 💎 透明クリスタルの「ぷるるんっ」コトコト音
                [523.25, 783.99].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const delay = now + i * 0.03;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, delay);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.6, delay + 0.12);

                    gain.gain.setValueAtTime(0.25 * intensity, delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, delay + 0.12);

                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(delay); osc.stop(delay + 0.13);
                });

            } else if (soundType === 'gold_sparkle') {
                // 👑 黄金スクイーズのキラキラ響く音
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const delay = now + idx * 0.025;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, delay);
                    gain.gain.setValueAtTime(0.18 * intensity, delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, delay + 0.14);

                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(delay); osc.stop(delay + 0.15);
                });
            }
        }

        // ガチャ獲得時のファンファーレ
        function playFanfareSound() {
            if (!audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime + idx * 0.07;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.36);
            });
        }

        // --- 3. 3D グラフィックス（Three.js） ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ライト設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffb6c1, 0.6, 10);
        pointLight.position.set(-3, -3, 2);
        scene.add(pointLight);

        // 床の柔らかな影
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 10),
            new THREE.ShadowMaterial({ opacity: 0.18 })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -1.7;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        // スクイーズメッシュ変数
        let currentMesh = null;
        let originalPositions = null;
        let velocities = null;
        let currentGeometry = null;
        let activeSquishyData = null;

        // 形状生成
        function buildGeometry(type) {
            switch(type) {
                case 'donut': 
                    return new THREE.TorusGeometry(1.0, 0.48, 36, 72);
                case 'macaron': 
                    const geomMac = new THREE.SphereGeometry(1.2, 64, 64);
                    geomMac.scale(1.2, 0.65, 1.2);
                    return geomMac;
                case 'star': 
                    return new THREE.OctahedronGeometry(1.3, 4);
                case 'crystal': 
                    return new THREE.IcosahedronGeometry(1.2, 2);
                case 'peach':
                default:
                    const geomPeach = new THREE.SphereGeometry(1.25, 64, 64);
                    const pos = geomPeach.attributes.position.array;
                    for (let i = 0; i < pos.length; i += 3) {
                        if (pos[i+1] > 0.6) {
                            pos[i] *= 0.85;
                            pos[i+2] *= 0.85;
                        }
                    }
                    return geomPeach;
            }
        }

        // 3Dスクイーズの再生成
        function createSquishyMesh(itemData) {
            activeSquishyData = itemData;
            if (currentMesh) scene.remove(currentMesh);

            currentGeometry = buildGeometry(itemData.type);
            const posAttr = currentGeometry.attributes.position;
            originalPositions = new Float32Array(posAttr.array.length);
            velocities = new Float32Array(posAttr.array.length);

            for (let i = 0; i < posAttr.array.length; i++) {
                originalPositions[i] = posAttr.array[i];
                velocities[i] = 0;
            }

            const material = new THREE.MeshPhysicalMaterial({
                color: itemData.color,
                roughness: itemData.rough !== undefined ? itemData.rough : 0.12,
                metalness: itemData.metal !== undefined ? itemData.metal : 0.02,
                transmission: itemData.trans !== undefined ? itemData.trans : 0.08,
                thickness: 0.6,
                clearcoat: 0.4,
                clearcoatRoughness: 0.1
            });

            currentMesh = new THREE.Mesh(currentGeometry, material);
            currentMesh.castShadow = true;
            currentMesh.receiveShadow = true;
            scene.add(currentMesh);
        }

        // ぷにぷに弾力シミュレーション
        const damping = 0.85;
        const stiffness = 0.095;

        function updateDeformation() {
            if (!currentGeometry) return;
            const positions = currentGeometry.attributes.position.array;

            for (let i = 0; i < positions.length; i += 3) {
                const dx = originalPositions[i] - positions[i];
                const dy = originalPositions[i + 1] - positions[i + 1];
                const dz = originalPositions[i + 2] - positions[i + 2];

                velocities[i] += dx * stiffness;
                velocities[i + 1] += dy * stiffness;
                velocities[i + 2] += dz * stiffness;

                velocities[i] *= damping;
                velocities[i + 1] *= damping;
                velocities[i + 2] *= damping;

                positions[i] += velocities[i];
                positions[i + 1] += velocities[i + 1];
                positions[i + 2] += velocities[i + 2];
            }

            currentGeometry.attributes.position.needsUpdate = true;
            currentGeometry.computeVertexNormals();
        }

        // --- 4. タッチ・へこみ処理 & コインpop演出 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDragging = false;
        let lastSoundTime = 0;

        function getIntersection(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);

            if (clientX === undefined || clientY === undefined) return null;

            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentMesh);
            return intersects.length > 0 ? { hit: intersects[0], x: clientX, y: clientY } : null;
        }

        function deformAtPoint(point, force = 0.5, radius = 0.85) {
            const positions = currentGeometry.attributes.position.array;
            const localPoint = point.clone().applyMatrix4(currentMesh.matrixWorld.clone().invert());

            for (let i = 0; i < positions.length; i += 3) {
                const vx = positions[i];
                const vy = positions[i + 1];
                const vz = positions[i + 2];

                const dist = Math.sqrt((vx - localPoint.x) ** 2 + (vy - localPoint.y) ** 2 + (vz - localPoint.z) ** 2);

                if (dist < radius) {
                    const effect = (1 - dist / radius) * force;
                    const normal = new THREE.Vector3(vx, vy, vz).normalize();
                    velocities[i] -= normal.x * effect;
                    velocities[i + 1] -= normal.y * effect;
                    velocities[i + 2] -= normal.z * effect;
                }
            }
        }

        function spawnCoinPop(x, y, amount) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.textContent = `+${amount}G`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        window.addEventListener('pointerdown', (e) => {
            initAudio();
            const res = getIntersection(e);
            if (res) {
                isDragging = true;
                controls.enabled = false;
                deformAtPoint(res.hit.point, 0.55);
                
                playSquishSound(activeSquishyData.soundType, 1.0);
                
                addCoins(10);
                spawnCoinPop(res.x, res.y, 10);
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const res = getIntersection(e);
                if (res) {
                    deformAtPoint(res.hit.point, 0.2);
                    const now = Date.now();
                    if (now - lastSoundTime > 140) {
                        playSquishSound(activeSquishyData.soundType, 0.6);
                        addCoins(2);
                        spawnCoinPop(res.x, res.y, 2);
                        lastSoundTime = now;
                    }
                }
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            controls.enabled = true;
        });

        function addCoins(amount) {
            state.coins += amount;
            document.getElementById('coin-count').textContent = state.coins;
            updateGachaUI();
        }

        // --- 5. ガチャ & UIシステム ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if (id === 'modal-gacha') renderGachaList();
            if (id === 'modal-collection') renderCollectionList();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('open-gacha').addEventListener('click', () => openModal('modal-gacha'));
        document.getElementById('open-collection').addEventListener('click', () => openModal('modal-collection'));

        function renderGachaList() {
            const list = document.getElementById('gacha-list');
            list.innerHTML = '';
            GACHAS.forEach(g => {
                const canAfford = state.coins >= g.cost;
                const div = document.createElement('div');
                div.className = 'gacha-card';
                div.innerHTML = `
                    <div class="gacha-info">
                        <h4>${g.name}</h4>
                        <p>${g.desc}</p>
                        <p style="color: #ff5e97; font-weight: 900; margin-top: 4px;">🪙 ${g.cost} G</p>
                    </div>
                    <button class="btn-draw" ${canAfford ? '' : 'disabled'} onclick="drawGacha('${g.id}', ${g.cost})">ひく</button>
                `;
                list.appendChild(div);
            });
        }

        function updateGachaUI() {
            if (document.getElementById('modal-gacha').classList.contains('active')) {
                renderGachaList();
            }
        }

        window.drawGacha = function(gachaId, cost) {
            if (state.coins < cost) return;
            addCoins(-cost);

            const pool = SQUISHIES.filter(s => s.gachaId === gachaId);
            const prize = pool[Math.floor(Math.random() * pool.length)];

            if (!state.unlocked.includes(prize.id)) {
                state.unlocked.push(prize.id);
            }

            equipSquishy(prize.id);
            closeModal('modal-gacha');

            document.getElementById('result-icon').textContent = prize.icon;
            document.getElementById('result-name').textContent = prize.name;
            document.getElementById('result-sound-tag').textContent = prize.soundName;
            openModal('modal-result');
            playFanfareSound();
        };

        function renderCollectionList() {
            const grid = document.getElementById('collection-list');
            grid.innerHTML = '';
            SQUISHIES.forEach(item => {
                const isUnlocked = state.unlocked.includes(item.id);
                const isEquipped = state.equipped === item.id;
                
                const card = document.createElement('div');
                card.className = `item-card ${isUnlocked ? 'unlocked' : 'locked'} ${isEquipped ? 'equipped' : ''}`;
                card.innerHTML = `
                    <div class="item-icon">${isUnlocked ? item.icon : '❓'}</div>
                    <div class="item-name">${isUnlocked ? item.name : '？？？'}</div>
                    <div class="item-sound">${isUnlocked ? item.soundName.split(' ')[1] : ''}</div>
                `;

                if (isUnlocked) {
                    card.onclick = () => {
                        equipSquishy(item.id);
                        renderCollectionList();
                    };
                }
                grid.appendChild(card);
            });
        }

        function equipSquishy(id) {
            state.equipped = id;
            const itemData = SQUISHIES.find(s => s.id === id);
            createSquishyMesh(itemData);
        }

        // 初期設定
        equipSquishy('crispy_bag');

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ループアニメーション
        function animate() {
            requestAnimationFrame(animate);
            if (currentMesh && !isDragging) {
                currentMesh.rotation.y += 0.004;
            }
            updateDeformation();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
